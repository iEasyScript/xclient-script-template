# Your plugin class's simple name. The built jar is named after it (build/libs/TemplatePlugin.jar),
# and it must match the internal name of your store listing. Change it when you rename the class.
pluginName=TemplatePlugin

# The Project X client your script compiles against. Keep this on the current release:
# https://github.com/iEasyScript/xclient/releases
#
# It only decides which client jar you compile against, not which clients can run your script;
# that is minClientVersion in your @PluginDescriptor. If the Project X launcher has already
# downloaded this version to ~/.projectx/projectx-<version>.jar, the build uses that copy.
projectxClientVersion=1.0.56

# Or point at a specific client jar instead, e.g. one you built yourself:
# projectxClientPath=C:/Users/you/.projectx/projectx-1.0.56.jar
